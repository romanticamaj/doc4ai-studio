name: Feature request
description: Something Doc4AI should do that it does not do yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the task and what gets in the way, before any proposed solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: workaround
    attributes:
      label: What do you do today instead?
