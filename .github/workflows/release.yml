name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Publish image and release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/romanticamaj/doc4ai-studio:${{ github.ref_name }}
            ghcr.io/romanticamaj/doc4ai-studio:latest
      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="[${TAG#v}]" 'index($0, "## " v) == 1 {on = 1; next} /^## \[/ {on = 0} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md
