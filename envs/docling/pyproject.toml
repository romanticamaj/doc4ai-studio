[project]
name = "aidoc-env-docling"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docling[easyocr]>=2.60,<3",
  "torch>=2.7,<2.12",
  "torchvision>=0.22",
]

[project.optional-dependencies]
rapidocr = ["docling[rapidocr]", "onnxruntime-gpu>=1.20"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[tool.uv]
package = false
