[project]
name = "aidoc"
version = "0.1.0"
description = "Convert any document into AI-friendly Markdown + metadata"
requires-python = ">=3.10"
dependencies = [
  "pymupdf>=1.24",
  "psutil>=6",
  "tiktoken>=0.8",
  "nvidia-ml-py>=12",
  "tomli>=2; python_version < '3.11'",
  "tomli-w>=1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
aidoc = "aidoc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidoc"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-timeout>=2",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "pillow>=10",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs installed engine envs and a GPU"]
addopts = "-m 'not slow'"
timeout = 300

[tool.ruff]
line-length = 110
